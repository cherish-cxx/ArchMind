server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 服务名）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ★ 级联超时链的最外层，必须 > 里面的每一层：
        #     nginx(这里) > Java 代理 Python(70s) > Python 一轮最坏(58s)
        #        > 单次 LLM(25s) > Python 调 Java 工具(8s)
        # nginx 默认只有 60s —— 比 Java 的 70s 还短，会在网关还没答完时就掐断，
        # 结果超时点从 Java 挪到 nginx，问题一点没解决（设计 §3.2 讲的「配置问题不是拓扑问题」）。
        # 90s 给 Agent 那条最慢的路（/api/agent/ask）留出余量。
        proxy_read_timeout 90s;
    }
}
