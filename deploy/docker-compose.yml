services:
  backend:
    build:
      context: ../ArchMind                # Java 模块目录（含 Dockerfile）
      # 与 agent-service 同理：BuildKit 默认构建网络取不到 Maven 仓库
      network: host
    container_name: archmind-backend
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # 关键：指向 compose 服务名，而不是 localhost
      - AGENT_BASE_URL=http://agent-service:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      # R7：project_brief 里回填的 MCP 连接地址（Java 读）
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:?MCP_PUBLIC_URL must be set}
    volumes:
      # 上传文件落盘目录。默认 ./code-workspace（相对 deploy/）：
      # 服务器上的旧部署就是这个位置，改掉会让已上传项目“消失”。
      - ${WORKSPACE_DIR:-./code-workspace}:/app/code-workspace
    depends_on:
      - agent-service
    restart: unless-stopped

  agent-service:
    build:
      context: ../agent-service        # 构建上下文是源码目录，不是 deploy 下
      # BuildKit 默认构建网络下 pip 取不到包索引（报 from versions: none），
      # 用宿主网络构建；只影响 docker build，不影响运行时网络。
      network: host
    container_name: archmind-agent
    environment:
      - JAVA_BASE_URL=http://backend:8080
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://172.21.160.203:6379
      - REDIS_DB=1
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # R5：MySQL 持久化（Python 直连；运行时账号只有 agent_* 三张表的 DML 权限）
      - AGENT_MYSQL_HOST=${AGENT_MYSQL_HOST:-172.21.160.203}
      - AGENT_MYSQL_PORT=${AGENT_MYSQL_PORT:-3306}
      - AGENT_MYSQL_DATABASE=${AGENT_MYSQL_DATABASE:-archmind}
      - AGENT_MYSQL_USER=${AGENT_MYSQL_USER:-archmind_agent}
      - AGENT_MYSQL_PASSWORD=${AGENT_MYSQL_PASSWORD:-}
      # R4：embed / Qdrant 目前是宿主机上单独 docker run 的容器
      - EMBED_URL=${EMBED_URL:-http://172.21.160.203:8010}
      - QDRANT_URL=${QDRANT_URL:-http://172.21.160.203:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-archmind_classes}
      # R5 记忆。compose 只注入这里显式列出的变量 —— 只在 deploy/.env 里写不起作用。
      - MEMORY_ENABLED=${MEMORY_ENABLED:-false}
      # 只结算最近 N 天结束的会话；首次上线设 0，避免把历史会话一次蒸完
      - MEMORY_DISTILL_MAX_AGE_DAYS=${MEMORY_DISTILL_MAX_AGE_DAYS:-7}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"                          # 只对内，不发布到宿主机
    healthcheck:
      # slim 镜像没有 curl/wget，用 Python 自检
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # R7：独立 MCP 进程（Streamable HTTP）。复用 agent-service 镜像，
  # 只换启动命令；对外经 nginx /mcp。
  mcp:
    build:
      context: ../agent-service
      network: host
    container_name: archmind-mcp
    environment:
      - JAVA_BASE_URL=http://backend:8080
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - REDIS_URL=redis://172.21.160.203:6379
      - REDIS_DB=1
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EMBED_URL=${EMBED_URL:-http://172.21.160.203:8010}
      - QDRANT_URL=${QDRANT_URL:-http://172.21.160.203:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-archmind_classes}
      # 每个 PAT 的每分钟请求上限；缓存默认 0（吊销必须立即生效）
      - MCP_RATE_LIMIT_PER_MINUTE=${MCP_RATE_LIMIT_PER_MINUTE:-60}
      - MCP_CONTEXT_CACHE_SECONDS=${MCP_CONTEXT_CACHE_SECONDS:-0}
    command: ["uvicorn", "app.mcp.asgi:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"                          # 只对内，由 nginx /mcp 反代
    depends_on:
      backend:
        condition: service_started
      mcp-migrate:
        condition: service_completed_successfully
    healthcheck:
      # 同 agent-service：slim 镜像没有 curl/wget，用 Python 自检
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # R5：一次性迁移。**不在 app 的 lifespan 里跑** —— 多 worker 会并发，
  # 失败还会被 restart: unless-stopped 无限重试。
  migrate:
    build:
      context: ../agent-service
      network: host
    container_name: archmind-agent-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - AGENT_MYSQL_HOST=${AGENT_MYSQL_HOST:-172.21.160.203}
      - AGENT_MYSQL_PORT=${AGENT_MYSQL_PORT:-3306}
      - AGENT_MYSQL_DATABASE=${AGENT_MYSQL_DATABASE:-archmind}
      - AGENT_MYSQL_USER=${AGENT_MYSQL_MIGRATE_USER:-archmind_migrate}
      - AGENT_MYSQL_PASSWORD=${AGENT_MYSQL_MIGRATE_PASSWORD:-}
    restart: "no"

  # R7：一次性的 Java 侧 SQL 迁移。alembic 只跑 Python 的 agent_* 表，
  # mcp_pat 是 Java 管理的表；不建表则 PAT 创建时报 table doesn't exist。
  # SQL 幂等（CREATE TABLE IF NOT EXISTS），每次 deploy 重跑安全。
  mcp-migrate:
    image: mysql:8
    container_name: archmind-mcp-migrate
    volumes:
      - ../ArchMind/sql:/sql:ro
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-172.21.160.203}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-archmind}
      - MYSQL_USER=${MYSQL_USER:-archmind}
      # 用 MYSQL_PWD 而不是 -p：避免交互式密码提示与引号转义问题
      - MYSQL_PWD=${MYSQL_PASSWORD}
    entrypoint: ["sh", "-c", "mysql -h \"$$MYSQL_HOST\" -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" < /sql/2026-11-16-mcp_pat.sql"]
    restart: "no"

  frontend:
    build:
      context: ../../ArchMind-react      # 独立前端仓库（与 ArchMind 平级）
      network: host
    container_name: archmind-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - mcp                             # nginx 的 /mcp 反代目标
    restart: unless-stopped
